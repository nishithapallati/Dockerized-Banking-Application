services:

  mysql:
    image: mysql:8.4
    container_name: banking-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: banking_db

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql


  flask:
    build: .
    container_name: banking-flask
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root123
      MYSQL_DATABASE: banking_db
      SECRET_KEY: banking-secret-key

    depends_on:
      - mysql


volumes:
  mysql_data: